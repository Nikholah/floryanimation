# Build Astro + déploiement GitHub Pages.
# Prérequis : Settings > Pages > Build and deployment > Source = "GitHub Actions".
# À la migration vers Cloudflare Pages avec floryanimation.com, ce workflow pourra être supprimé.
name: Déploiement GitHub Pages

on:
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: pages
    cancel-in-progress: false

jobs:
    build:
        runs-on: ubuntu-latest
        env:
            # Project page GitHub : https://nikholah.github.io/floryanimation/
            SITE_URL: https://nikholah.github.io
            BASE_PATH: /floryanimation
        steps:
            - uses: actions/checkout@v4
            - uses: withastro/action@v3
              with:
                  node-version: 24

    deploy:
        needs: build
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - id: deployment
              uses: actions/deploy-pages@v4
